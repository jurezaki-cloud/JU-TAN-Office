name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.1)
        required: true
        default: v1.0.1
      publish:
        description: Publish the release (false creates a draft)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      JU_TAN_REQUIRE_SIGNED: "1"
      JU_TAN_PFX: ${{ github.workspace }}\signing\ju-tan-studio.pfx
      JU_TAN_PFX_PASSWORD: ${{ secrets.JU_TAN_PFX_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release inputs and secrets
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.JU_TAN_PFX_BASE64 }}
        run: |
          if ("$env:PFX_BASE64".Length -lt 100) { throw "Missing JU_TAN_PFX_BASE64 repository secret. Production release is blocked." }
          if ([string]::IsNullOrWhiteSpace("$env:JU_TAN_PFX_PASSWORD")) { throw "Missing JU_TAN_PFX_PASSWORD repository secret. Production release is blocked." }
          $version = (Select-String -Path app/core/constants.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          if ("${{ inputs.tag }}" -ne "v$version") { throw "Tag ${{ inputs.tag }} does not match APP_VERSION $version." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup and Windows SDK
        shell: pwsh
        run: choco install innosetup windows-sdk-10-version-2004-all -y --no-progress

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.JU_TAN_PFX_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force -Path signing | Out-Null
          [IO.File]::WriteAllBytes($env:JU_TAN_PFX, [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Build and verify signed release
        shell: pwsh
        run: |
          .\scripts\build_release.ps1 -RequireSigned
          .\scripts\verify_release_signatures.ps1 -RequireSigned
          .\scripts\check_installer_production.ps1 -RequireSignedArtifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JU-TAN-Office-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/JU-TAN-Office-Setup.exe
            dist/JU-TAN-Office-Portable.zip
            dist/SHA256SUMS.txt
            dist/Version.txt
            dist/RELEASE_NOTES.md
            dist/PRIVACY.md
            dist/USER_GUIDE.pdf
            dist/ADMIN_GUIDE.pdf

      - name: Create draft release
        if: ${{ !inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --draft --title "JU-TAN Office ${{ inputs.tag }}" --notes-file dist/RELEASE_NOTES.md dist/JU-TAN-Office-Setup.exe dist/JU-TAN-Office-Portable.zip dist/SHA256SUMS.txt dist/Version.txt dist/PRIVACY.md

      - name: Publish release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --title "JU-TAN Office ${{ inputs.tag }}" --notes-file dist/RELEASE_NOTES.md --latest dist/JU-TAN-Office-Setup.exe dist/JU-TAN-Office-Portable.zip dist/SHA256SUMS.txt dist/Version.txt dist/PRIVACY.md

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: if (Test-Path signing) { Remove-Item signing -Recurse -Force }
