name: Windows installer build (unsigned)
# Rebuild on merge of the direct Customers import fix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-unsigned-installer.yml

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      JU_TAN_REQUIRE_SIGNED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Check Customers page import
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_company_lookup.py
      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build_release.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          if (-not (Test-Path dist/JU-TAN-Office-Setup.exe)) { throw "Installer missing" }
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: JU-TAN-Office-customer-fix-unsigned
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/JU-TAN-Office-Setup.exe
            dist/SHA256SUMS.txt
