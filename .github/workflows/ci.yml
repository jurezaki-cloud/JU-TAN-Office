name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: xcb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 xvfb fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app app.py

      - name: Run core and non-GUI tests
        run: python -m pytest -q

      - name: Diagnose Settings GUI tests
        continue-on-error: true
        env:
          JU_TAN_FORCE_GUI_TESTS: "1"
        run: xvfb-run -a python -m pytest -vv tests/test_settings_users_card.py
